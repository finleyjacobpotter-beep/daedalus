[project]
name = "daedalus"
version = "0.2.0"
description = "Run a project's work inside the pinned Daedalus workshop container (replaces the Makefile)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
daedalus = "daedalus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daedalus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["agent", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
