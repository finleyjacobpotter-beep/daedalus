# Builds, smoke-tests and pushes both images.
# Assumes a Forgejo runner registered with a `podman-host` label using the
# host executor (podman installed on the runner). Building images inside a
# docker-executor job container needs a privileged runner instead.
name: build-daedalus

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"   # weekly rebuild to pick up Fedora security updates
  workflow_dispatch:

jobs:
  build:
    runs-on: podman-host
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then t="${GITHUB_REF_NAME#v}"; else t="$(date +%Y.%m.%d)"; fi
          echo "TAG=$t" >> "$GITHUB_ENV"

      - name: Build
        run: make build TAG="$TAG" REGISTRY="${{ vars.REGISTRY }}"

      - name: Smoke test
        run: make test TAG="$TAG" REGISTRY="${{ vars.REGISTRY }}"

      - name: Push
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          reg="${{ vars.REGISTRY }}"
          echo "$REGISTRY_TOKEN" | podman login -u "$REGISTRY_USER" --password-stdin "${reg%%/*}"
          make push TAG="$TAG" REGISTRY="${{ vars.REGISTRY }}"
