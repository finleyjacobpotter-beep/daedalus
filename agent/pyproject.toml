[project]
name = "daedalus-agent"
version = "0.1.0"
description = "The Daedalus AI agent: a tau-based coding agent with explicit tools and agent teams (hyper planning, ultrawork)."
requires-python = ">=3.12"
dependencies = [
    "tau-ai==0.4.6",
    "httpx>=0.27",
    "pydantic>=2.11",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
daedalus-agent = "daedalus_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daedalus_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
