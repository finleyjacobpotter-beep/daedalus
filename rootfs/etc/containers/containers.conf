# Nested (container-in-container) defaults, mirroring quay.io/buildah/stable.
# The outer container already provides isolation; the inner runtime shares its
# namespaces instead of trying to create cgroups it is not allowed to manage.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
