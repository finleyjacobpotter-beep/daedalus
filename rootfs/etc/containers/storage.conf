# Rootless graphroot defaults to ~/.local/share/containers/storage, which the
# daedalus mounts as a named volume (not overlayfs), so overlay can stack on it.
# fuse-overlayfs is used because native rootless overlay inside a user
# namespace that is itself inside a container is not reliable on every kernel.
[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
