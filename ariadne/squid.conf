# Forward proxy only. No caching, no TLS interception: HTTPS is tunnelled with
# CONNECT and filtered on the requested hostname.
http_port 3128

acl allowed dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Raw IP destinations are refused outright: dstdomain would otherwise do a
# reverse lookup on them, which an attacker-controlled PTR record could satisfy.
acl to_ip dstdom_regex ^[0-9.]+$ ^\[.*\]$

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_ip
http_access allow allowed
http_access deny all

cache deny all
cache_mem 0 MB
logfile_rotate 0
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
coredump_dir /var/spool/squid
forwarded_for delete
via off
